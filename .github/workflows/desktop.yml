name: Windows application
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'El tag debe coincidir con la versión de package.json.' }
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run desktop:dist
        env:
          VITE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged application
        run: npm run test:desktop
        env:
          DESKTOP_EXECUTABLE: release/win-unpacked/Yellow Garden.exe
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/YellowGarden-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yellow-garden-windows-x64
          path: |
            release/YellowGarden-Setup-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yellow-garden-web
          path: dist
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yellow-garden-windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt --verify-tag --draft --title "Yellow Garden $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
